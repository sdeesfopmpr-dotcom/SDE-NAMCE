<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Controle de Escalas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dfe3e9;--ok:#1f9d55;--okbg:#e3f6ea;--sel:#2563eb;--selbg:#dbe7ff;--bl:#c2410c;--blbg:#fdebdc;--brand:#3d4095;--gold:#fdc92b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181f;--card:#1e242d;--tx:#e8ecf1;--mut:#97a1b0;--bd:#323b47;--okbg:#17352496;--selbg:#1e3a6e;--blbg:#4a2a14;--ok:#4ade80;--sel:#7aa7ff;--bl:#fb923c;--brand:#7f86e6}}
:root[data-theme=dark]{--bg:#14181f;--card:#1e242d;--tx:#e8ecf1;--mut:#97a1b0;--bd:#323b47;--okbg:#17352496;--selbg:#1e3a6e;--blbg:#4a2a14;--ok:#4ade80;--sel:#7aa7ff;--bl:#fb923c;--brand:#7f86e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1250px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{cursor:pointer}nav button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:center;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}th small{display:block;color:var(--mut);font-weight:400}
.p{width:26px;height:26px;padding:0;border-radius:6px;display:block;margin:0 auto}.p:disabled:not(.bl):not(.cf){opacity:.4;cursor:not-allowed}.p.on{background:var(--selbg);border-color:var(--sel);border-width:2px}.p.cf{background:repeating-linear-gradient(45deg,rgba(127,127,127,.35) 0 4px,transparent 4px 8px);border-color:var(--mut);cursor:not-allowed}
.dt th,.dt td{padding:5px 3px}.dc{min-width:230px;text-align:left}.dc textarea{width:100%;min-width:220px;box-sizing:border-box;font:inherit;font-size:13px;resize:vertical;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px}
.ph{font-size:11px;white-space:nowrap}.dh{background:rgba(127,127,127,.14)}.dt td:first-child,.dt th:first-child{position:sticky;left:0;background:var(--card);z-index:1;padding-right:10px}
.p small{display:block;font-size:10px}
.p.ok{background:var(--okbg);border-color:var(--ok)}.p.sel{background:var(--selbg);border-color:var(--sel);border-width:2px}
.p.bl{background:repeating-linear-gradient(45deg,var(--blbg) 0 4px,transparent 4px 8px);border-color:var(--bl);cursor:not-allowed}
.leg{color:var(--mut);font-size:13px}.x{color:#c0392b;border:0;background:none;padding:2px 8px}
.mut{color:var(--mut)}#pr{display:none}
@media print{body *{visibility:hidden}#pr,#pr *{visibility:visible}#pr{display:block;position:absolute;left:0;top:0;width:100%;color:#000}main{padding:0}}
.pt{width:100%;margin-bottom:14px}.pt td,.pt th{border:1px solid #888;text-align:left}

const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const info=e=>{const t=[e.ano,e.pel].filter(Boolean).map(esc).join(' · ');return t?`<br><small class="mut">${t}</small>`:''};
const nm=id=>(S.emps.find(e=>e.id===id)||{name:'?'}).name;
const fd=d=>d.split('-').reverse().join('/').slice(0,5);
const pr=()=>S.prior.filter(x=>PM[x.per]),sc=()=>S.sched.filter(x=>PM[x.per]);
const fl=(e,w)=>(S.flags||[]).find(x=>x.emp===e&&x.date===w),FN={TD:'TD',TR:'Transferido'};
const st=(e,w,k)=>{const p=PM[k],m=x=>x.emp===e&&x.date===w;
 if(fl(e,w))return'fl';
 if(sc().some(x=>m(x)&&x.per===k))return'sel';
 if(pr().some(x=>m(x)&&ov(p,PM[x.per])))return'bl';
 if(sc().some(x=>m(x)&&ov(p,PM[x.per])))return'cf';
 return'ok'};
function toggle(e,k){const s=st(e,wk,k);if(s!=='ok'&&s!=='sel')return;
 if(s==='sel')S.sched=S.sched.filter(x=>!(x.emp===e&&x.date===wk&&x.per===k));else S.sched.push({emp:e,date:wk,per:k});save();render()}
const ER={'auth/email-already-in-use':'Este e-mail já está cadastrado.','auth/weak-password':'A senha deve ter ao menos 6 caracteres.','auth/invalid-email':'E-mail inválido.','auth/network-request-failed':'Sem conexão com a internet.'};
const err=t=>{msg=t;const m=$('lm');if(m)m.textContent=t};
function setMode(m){mode=m;msg='';render()}
function login(){auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value).catch(e=>err('E-mail ou senha inválidos.'))}
async function register(){const n=$('rn').value.trim(),m=$('re').value.trim(),p=$('rp').value;
 if(!n||!m||!p)return err('Preencha todos os campos.');
 if(p!==$('rq').value)return err('As senhas não coincidem.');
 reg=true;err('');
 try{const c=await auth.createUserWithEmailAndPassword(m,p);
  await db.doc('usuarios/'+c.user.uid).set({nome:n,email:m,aprovado:false,criado:firebase.firestore.FieldValue.serverTimestamp()})}
 catch(e){err(ER[e.code]||'Não foi possível concluir o cadastro.')}
 reg=false;if(auth.currentUser){user=auth.currentUser;session(user)}}
function vl(){const up=mode==='up';
 return`<div class="card lc"><h2>${up?'Cadastro':'Login'}</h2><div class="row" style="margin-top:14px;flex-direction:column;align-items:stretch">`+(up?
 `<input id="rn" placeholder="Nome completo"><input id="re" type="email" placeholder="E-mail"><input id="rp" type="password" placeholder="Senha (mín. 6 caracteres)"><input id="rq" type="password" placeholder="Confirmar senha" onkeydown="if(event.key==='Enter')register()"><button onclick="register()">Criar conta</button>`:
 `<input id="le" type="email" placeholder="E-mail"><input id="lp" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Entrar</button>`)
 +`<span id="lm" style="color:#c0392b">${msg}</span><button class="lk" onclick="setMode('${up?'in':'up'}')">${up?'Já tenho conta – entrar':'Não tem conta? Cadastre-se'}</button></div>${up?'<p class="leg" style="margin:8px 0 0">O acesso só é liberado após aprovação de um administrador.</p>':''}</div>`}
function vw(){return`<div class="card lc"><h2>Aguardando aprovação</h2><p style="text-align:center;margin:12px 0">Seu cadastro foi enviado.<br>Assim que um administrador aprovar, o acesso será liberado automaticamente.</p><div class="row" style="justify-content:center;margin:0"><button onclick="auth.signOut()">Sair</button></div></div>`}
function stopAll(){[unsub,unsubU,unsubA].forEach(f=>f&&f());unsub=unsubU=unsubA=null}
function startState(){if(unsub)return;
 unsub=REF.onSnapshot(d=>{if(d.exists&&!d.metadata.hasPendingWrites)S=Object.assign({emps:[],prior:[],sched:[],flags:[],desc:{},title:'Escala de MCEs'},d.data());render()},e=>{msg='Sem permissão de acesso.';auth.signOut()});
 unsubA=db.collection('usuarios').onSnapshot(q=>{isM=true;uList=q.docs.map(d=>({id:d.id,...d.data()}));const pc=uList.filter(x=>!x.aprovado).length;if(pc!==lastPc||tab==='u'){lastPc=pc;render()}},e=>{isM=false;uList=[]})}
function session(u){stopAll();pend=false;isM=false;uList=[];lastPc=-1;
 if(!u){render();return}
 unsubU=db.doc('usuarios/'+u.uid).onSnapshot(d=>{
  if(d.exists&&d.data().aprovado!==true){pend=true;if(unsub){unsub();unsub=null}if(unsubA){unsubA();unsubA=null}render()}
  else{pend=false;startState();render()}},e=>startState())}
auth.onAuthStateChanged(u=>{user=u;ready=true;if(!reg)session(u)});
function render(){
 document.body.classList.toggle('lg',ready&&(!user||pend));
 if(!ready)return;
 if(!user){$('nav').innerHTML='';$('v').innerHTML=vl();return}
 if(pend){$('nav').innerHTML='';$('v').innerHTML=vw();return}
 const pc=uList.filter(x=>!x.aprovado).length,T=TABS.concat(isM?[['u','Acessos'+(pc?' ('+pc+')':'')]]:[]);
 $('nav').innerHTML=T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')+'<button onclick="auth.signOut()" style="margin-left:auto">Sair</button>';
 $('v').innerHTML=({d:vd,a:va,f:vf,e:ve,u:vu})[tab==='u'&&!isM?'d':tab]();
}
function vu(){
 const L=[...uList].sort((a,b)=>(a.aprovado===b.aprovado?0:a.aprovado?1:-1)||(a.nome||'').localeCompare(b.nome||'')).map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.email)}</td><td>${x.aprovado?'✅ Aprovado':'⏳ Pendente'}</td><td style="text-align:right">${x.aprovado?`<button class="x" onclick="acesso('${x.id}',false)">Revogar</button>`:`<button onclick="acesso('${x.id}',true)">Aprovar</button>`} <button class="x" onclick="delAcesso('${x.id}')">Excluir</button></td></tr>`).join('');
 return`<div class="card"><b>Solicitações de acesso</b> <span class="mut">(quem se cadastra fica pendente até ser aprovado aqui)</span><table style="margin-top:8px"><tr><th>Nome</th><th>E-mail</th><th>Situação</th><th></th></tr>${L||'<tr><td colspan=4 class="mut">Nenhum cadastro.</td></tr>'}</table></div>`}
function acesso(id,v){db.doc('usuarios/'+id).update({aprovado:v}).catch(e=>alert('Erro: '+e.message))}
function delAcesso(id){if(confirm('Excluir este cadastro? A conta continua existindo no Firebase Authentication (apague lá se quiser removê-la de vez).'))db.doc('usuarios/'+id).delete().catch(e=>alert('Erro: '+e.message))}
function setDesc(id,v){S.desc=S.desc||{};const k=id+'|'+wk;v=v.trim();if(v)S.desc[k]=v;else delete S.desc[k];save()}
function flag(e,t){const f=fl(e,wk);
 if(f&&f.t===t)S.flags=S.flags.filter(x=>x!==f);
 else if(f)return;
 else{const n=sc().filter(x=>x.emp===e&&x.date===wk).length;
  if(n&&!confirm(nm(e)+' tem '+n+' período(s) escalado(s) neste fim de semana. Marcar '+FN[t]+' vai removê-los. Continuar?'))return;
  S.sched=S.sched.filter(x=>!(x.emp===e&&x.date===wk));S.flags=(S.flags||[]).concat([{emp:e,date:wk,t}])}
 save();render()}
function vd(){
 if(!S.emps.length)return'<div class="card">Cadastre os cadetes na aba <b>Cadetes</b> para começar.</div>';
 const g=D.map((n,i)=>`<th colspan="${PER.filter(p=>p.d===i).length}" class="dh">${n}<small>${fd(addD(wk,i))}</small></th>`).join('')+'<th colspan="2" class="dh">Situação<small>fim de semana inteiro</small></th>';
 const h=PER.map(p=>`<th class="ph">${p.n}<small>${p.h}</small></th>`).join('')+'<th class="ph">TD<small>Trab. Didático</small></th><th class="ph">Transferido<small>&nbsp;</small></th>';
 const rows=S.emps.map(e=>{const f=fl(e.id,wk);return`<tr><td><b>${e.name}</b>${info(e)}</td><td class="dc"><textarea rows="2" placeholder="Descreva a ação cometida…" onchange="setDesc('${e.id}',this.value)">${esc((S.desc||{})[e.id+'|'+wk])}</textarea></td>`+PER.map(p=>{const s=st(e.id,wk,p.k);
  const L={ok:['Livre',p.i,'Disponível – clique para escalar'],sel:['Escalado',p.i,'Escalado – clique para remover'],bl:['Ocupado','🚫','Indisponível (escala anterior)'],cf:['Conflito','⚠️','Conflita com outro período escalado'],fl:[f&&f.t==='TD'?'TD':'Transf.','🚫',f?'Bloqueado: '+FN[f.t]+' neste fim de semana':'']}[s];
  return`<td><button class="p ${s==='fl'?'bl':s}" ${s==='ok'||s==='sel'?'':'disabled'} onclick="toggle('${e.id}','${p.k}')" title="${L[2]}"></button></td>`}).join('')
  +['TD','TR'].map(t=>{const on=f&&f.t===t;return`<td><button class="p ${on?'on':''}" ${f&&!on?'disabled':''} onclick="flag('${e.id}','${t}')" title="${on?'Clique para remover':'Bloqueia o fim de semana inteiro'}"></button></td>`}).join('')+'</tr>'}).join('');
 return`<div class="card"><div class="row"><label>Fim de semana (sexta-feira): <input type="date" value="${wk}" onchange="if(this.value){wk=snap(this.value);render()}"></label><span class="mut">${fd(wk)} a ${fd(addD(wk,2))}</span></div>
 <table class="dt"><tr><th rowspan="2">Cadete</th><th rowspan="2" class="dc">Descrição da ação cometida<small>a avaliar neste fim de semana</small></th>${g}</tr><tr>${h}</tr>${rows}</table>
 <p class="leg">Verde = disponível · Azul = escalado · Laranja listrado = ocupado por escala anterior · Cinza listrado = conflito de horário · TD (Trabalho Didático) e Transferido bloqueiam o cadete no fim de semana inteiro · EEsp = Escala Especial · LC = Licença Cassada</p></div>`}
function addPrior(){const e=$('ae').value,w=$('ad').value&&snap($('ad').value);const ks=[...document.querySelectorAll('.cp:checked')].map(c=>c.value);
 if(!e||!w||!ks.length)return alert('Escolha o cadete, o fim de semana e ao menos um período.');
 ks.forEach(k=>{if(!pr().some(x=>x.emp===e&&x.date===w&&x.per===k))S.prior.push({id:uid(),emp:e,date:w,per:k});
  S.sched=S.sched.filter(x=>!(x.emp===e&&x.date===w&&PM[x.per]&&ov(PM[x.per],PM[k])))});
 ad={e,d:w};save();render()}
function va(){
 const L=pr().sort((a,b)=>a.date.localeCompare(b.date)||PM[a.per].a-PM[b.per].a).map(x=>{const p=PM[x.per];return`<tr><td>${nm(x.emp)}</td><td>${D[p.d]} ${fd(addD(x.date,p.d))}</td><td>${p.i} ${p.n} <span class="mut">(${p.h})</span></td><td><button class="x" onclick="S.prior=S.prior.filter(y=>y.id!=='${x.id}');save();render()">✕</button></td></tr>`}).join('');
 return`<div class="card"><b>Lançar escala anterior</b> <span class="mut">(períodos já comprometidos)</span><div class="row" style="margin-top:8px">
 <select id="ae"><option value="">Cadete…</option>${S.emps.map(e=>`<option value="${e.id}" ${e.id===ad.e?'selected':''}>${e.name}</option>`).join('')}</select>
 <label>Fim de semana (sexta-feira): <input type="date" id="ad" value="${ad.d}"></label></div>
 ${D.map((n,i)=>`<div class="row"><b style="min-width:90px">${n}</b>${PER.filter(p=>p.d===i).map(p=>`<label><input type="checkbox" class="cp" value="${p.k}"> ${p.i} ${p.n} <span class="mut">${p.h}</span></label>`).join('')}</div>`).join('')}
 <button onclick="addPrior()">Adicionar</button></div>
 <div class="card"><table><tr><th>Cadete</th><th>Dia</th><th>Período</th><th></th></tr>${L||'<tr><td colspan=4 class="mut">Nenhuma escala anterior lançada.</td></tr>'}</table></div>`}
function addEmp(){const v=$('en').value.trim();if(!v)return;S.emps.push({id:uid(),name:v,ano:$('ea').value.trim(),pel:$('ep').value.trim()});save();render()}
function setEmp(id,k,v){const e=S.emps.find(x=>x.id===id);if(e){e[k]=v.trim();save()}}
function delEmp(id){if(!confirm('Remover o cadete e suas escalas?'))return;S.emps=S.emps.filter(e=>e.id!==id);S.prior=S.prior.filter(x=>x.emp!==id);S.sched=S.sched.filter(x=>x.emp!==id);S.flags=(S.flags||[]).filter(x=>x.emp!==id);Object.keys(S.desc||{}).forEach(k=>{if(k.startsWith(id+'|'))delete S.desc[k]});save();render()}
function vf(){return`<div class="card"><div class="row"><input id="en" placeholder="Nome do cadete" style="flex:2;min-width:160px"><input id="ea" placeholder="Ano/Turma" style="width:110px"><input id="ep" placeholder="Pelotão" style="width:110px" onkeydown="if(event.key==='Enter')addEmp()"><button onclick="addEmp()">Adicionar</button></div>
 <table><tr><th>Nome</th><th>Ano/Turma</th><th>Pelotão</th><th></th></tr>${S.emps.map(e=>`<tr><td>${e.name}</td><td><input value="${esc(e.ano)}" style="width:100px" onchange="setEmp('${e.id}','ano',this.value)"></td><td><input value="${esc(e.pel)}" style="width:100px" onchange="setEmp('${e.id}','pel',this.value)"></td><td style="text-align:right"><button class="x" onclick="delEmp('${e.id}')">Remover</button></td></tr>`).join('')||'<tr><td colspan=4 class="mut">Nenhum cadete.</td></tr>'}</table></div>`}
function sheet(){
 const l=sc(),f=S.flags||[],ws=[...new Set([...l.map(x=>x.date),...f.map(x=>x.date)])].sort();
 if(!ws.length)return'<p class="mut">Nenhum cadete escalado ainda.</p>';
 return ws.map(w=>D.map((n,i)=>{const r=PER.filter(p=>p.d===i).map(p=>{const t=l.filter(x=>x.date===w&&x.per===p.k).map(x=>nm(x.emp)).sort().join(', ');
  return t?`<tr><td style="width:90px">${p.i} ${p.n}</td><td style="width:120px">${p.h}</td><td>${t}</td></tr>`:''}).join('');
  return r?`<table class="pt"><tr><th colspan="3">${n}, ${fd(addD(w,i))}</th></tr>${r}</table>`:''}).join('')
  +(()=>{const r=['TD','TR'].map(t=>{const n=f.filter(x=>x.date===w&&x.t===t).map(x=>nm(x.emp)).sort().join(', ');return n?`<tr><td style="width:130px">${t==='TD'?'📚 TD':'🔄 Transferido'}</td><td>${n}</td></tr>`:''}).join('');
   return r?`<table class="pt"><tr><th colspan="2">Situação – fim de semana ${fd(w)} a ${fd(addD(w,2))}</th></tr>${r}</table>`:''})()).join('')+'<p style="font-size:12px">EEsp: Escala Especial · LC: Licença Cassada · TD: Trabalho Didático</p>'}
function ve(){return`<div class="card"><div class="row"><input id="tt" value="${S.title}" style="flex:1" oninput="S.title=this.value;save()"><button onclick="printIt()">🖨️ Gerar PDF</button></div>
 <p class="leg">Abre a janela de impressão: escolha “Salvar como PDF”.</p>${sheet()}</div>`}
function printIt(){$('pr').innerHTML=`<h2 style="margin:0 0 4px">${S.title}</h2><p style="margin:0 0 14px">Emitido em ${new Date().toLocaleDateString('pt-BR')}</p>${sheet()}`;window.print()}
render();
</script></body></html>
